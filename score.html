<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Score Card Demo </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="score.css">
</head>
<body>
    <header>
       <div class="tata-ipl">
        <img src="image/logo.png" >

      </div>
      <div class="jiohotstar">
      <h1> JioHotstar </h1>
      <p> 10.9Cr views</p>
      </div>
     
    </header>

<footer>
<div class="scorecard">
    <div class="team1-logo">
        <img src="https://play-lh.googleusercontent.com/Y20hN9aw0dX-ICqj7_xprmGWCdt64V0UWBa4Yef9mRG2OmBmvDy4qS356pEhmHTMsw">
    </div>
    <div class="team1">
        <div class="row1">
        <div class="team1-name">
         <p> RR </p>
         </div>
         <div class="team1-score">
            <p> 93-2</p>
         </div>
         <div class="overs">
            7.5
         </div>
        </div>
        <div class="row2">
            <div class="team2-name">
         <p> v GT </p>
         </div>
         <div class="venue">
            <p> NEW CHANDIGARH</p>
         </div>
    
            
        </div>
      
    </div>
     <div class="team1-bat">
        <div class="bat1">
            JADEJA 
        </div>
        <div class="bat2">
            SOORYAVANSHI  
        
        </div>
     </div>
        <div class="runs">
         <span >35</span>
                  
         <span>50</span>
                   
         </div>

        <div class="balls">
             <span>19</span>
             <span>31</span>
        </div>

    <div class="run-rate">
        <span class="text"> RUN-RATE </span>
        <span class="value"> 11.87</span>
    </div>

    <div class="team2">
        <div class="bowler-block">
        <span class="bowler">PRASIDH </span>
        <div class="over-boxes">
        <div class="ball">1</div>
        <div class="ball">🌳 </div>
        <div class="ball">4</div>
        <div class="ball">🌳 </div>
        <div class="ball">2</div>
        <div class="ball"> </div>
        </div>
      </div>
     
      <div class="spell">
        <span class="figure">
            0-31
        </span>
        <span class="bowled">
            2.5
        </span>
      </div>
     
    </div>
    <div class="team2-logo">
        <img src="https://i0.wp.com/www.inningsbreak.com/wp-content/uploads/2023/03/Gujarat-Titans-Logo.png?resize=678%2C381&ssl=1">
    </div>

  
</div>
</footer>
